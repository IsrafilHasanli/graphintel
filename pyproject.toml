[project]
name = "graphintel"
version = "0.1.0"
description = "GraphIntel - Graph RAG platform for Support and Incident Intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]
embeddings = [
    "boto3>=1.34",
    "fastembed>=0.7",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length handled by formatter; UP042: `class X(str, Enum)` is an
# intentional, widely-used idiom for JSON-serializable string enums.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in argument
# defaults; they are not the mutable-default footgun B008 targets.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]
